<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHANTOM - LOGIN</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

input {
  user-select: auto;
}

:root {
  --bg-black: #050507;
  --card-dark: #0e0e12;
  --card-border: #26262e;
  --input-border: #3a3a44;
  --btn-paste-bg: #1c1c24;
  --txt-white: #ffffff;
  --txt-gray: #8e8e99;
  --txt-muted: #52525e;
}

body {
  width: 100%;
  min-height: 100vh;
  background-color: var(--bg-black);
  color: var(--txt-white);
  font-family: 'Prompt', 'Inter', -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 20px 20px 30px;
  overflow-x: hidden;
  position: relative;
}

/* ลายน้ำโลโก้พื้นหลังขนาดใหญ่ */
.bg-watermark {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 440px;
  height: 440px;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
}

.top-bar {
  width: 100%;
  max-width: 400px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  z-index: 2;
}

.lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #e4e4e7;
  font-size: 13px;
  font-weight: 500;
  background: #111116;
  padding: 6px 14px;
  border: 1px solid #23232c;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

.login-wrapper {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
  margin: auto 0;
}

.brand-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 42px;
}

.skull-hero-box {
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.18));
}

.skull-hero-svg {
  width: 118px;
  height: 118px;
}

.brand-title {
  font-family: 'Chakra Petch', 'Inter', sans-serif;
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 6px;
  color: #ffffff;
  text-transform: uppercase;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}

.brand-desc {
  font-size: 13.5px;
  color: var(--txt-gray);
  font-weight: 400;
}

.form-box {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.field-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: #a1a1aa;
  margin-bottom: 2px;
}

.field-label-square {
  width: 7px;
  height: 7px;
  background: #ffffff;
}

/* กล่องกรอกคีย์ขอบตัดเฉียงสไตล์ Phantom */
.input-chamfer-wrap {
  position: relative;
  width: 100%;
  height: 56px;
  background: var(--input-border);
  padding: 1px;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: background 0.2s ease;
}

.input-chamfer-wrap:focus-within {
  background: #ffffff;
}

.input-chamfer-inner {
  width: 100%;
  height: 100%;
  background: #0c0c10;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  display: flex;
  align-items: center;
  padding: 0 10px 0 18px;
}

.key-input {
  flex: 1;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--txt-white);
  font-size: 15px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.key-input::placeholder {
  color: #52525e;
}

.btn-paste {
  height: 38px;
  padding: 0 16px;
  background: var(--btn-paste-bg);
  border: 1px solid #2e2e3a;
  color: #e4e4e7;
  font-family: 'Prompt', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  transition: opacity 0.2s;
}

.btn-paste:active {
  opacity: 0.75;
}

.btn-unlock {
  width: 100%;
  height: 54px;
  margin-top: 6px;
  background: #f4f4f5;
  color: #09090b;
  border: none;
  font-family: 'Prompt', sans-serif;
  font-size: 16.5px;
  font-weight: 700;
  cursor: pointer;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  transition: background 0.2s, transform 0.1s;
}

.btn-unlock:hover {
  background: #ffffff;
}

.btn-unlock:active {
  transform: scale(0.99);
}

.btn-unlock:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status-msg {
  width: 100%;
  margin-top: 10px;
  padding: 11px 14px;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: #fca5a5;
  font-size: 13px;
  text-align: center;
  display: none;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}

.status-msg.success {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.35);
  color: #6ee7b7;
}

.footer-text {
  margin-top: 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.footer-link-text {
  font-size: 13.5px;
  color: #a1a1aa;
}

.footer-sub-text {
  font-size: 12.5px;
  color: #52525e;
}
</style>
</head>
<body>

<!-- ลายน้ำพื้นหลัง -->
<svg class="bg-watermark" viewBox="0 0 100 100" fill="none">
  <path d="M50 8C26.8 8 14 23.5 14 46V86L26 76L38 86L50 76L62 86L74 76L86 86V46C86 23.5 73.2 8 50 8Z" fill="#ffffff"/>
</svg>

<div class="top-bar">
  <div class="lang-pill">
    <i class="fas fa-globe"></i> ไทย
  </div>
</div>

<div class="login-wrapper">
  <div class="brand-hero">
    <div class="skull-hero-box">
      <!-- โลโก้หัวกะโหลก PHANTOM -->
      <svg class="skull-hero-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 12C33.5 12 18 29.5 18 55V102L32 90L46 102L60 90L74 102L88 90L102 102V55C102 29.5 86.5 12 60 12Z" fill="#EFEFEF"/>
        <!-- ตาซ้าย -->
        <polygon points="28,49 52,55 49,68 31,66 26,58" fill="#52525B"/>
        <!-- ตาขวา -->
        <polygon points="92,49 68,55 71,68 89,66 94,58" fill="#52525B"/>
        <!-- จมูก -->
        <polygon points="60,64 55,73 65,73" fill="#52525B"/>
        <!-- รอยหยักปาก -->
        <path d="M43 79L50 84L56 79L60 83L64 79L70 84L77 79" stroke="#52525B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="brand-title">PHANTOM</h1>
    <p class="brand-desc">ไม่ต้องมีบัญชี ไม่ต้องมีรหัสผ่าน ใช้แค่คีย์</p>
  </div>

  <div class="form-box">
    <div class="field-label-row">
      <div class="field-label-square"></div>
      <span>คีย์เข้าใช้งาน</span>
    </div>

    <div class="input-chamfer-wrap">
      <div class="input-chamfer-inner">
        <input type="text" id="keyInput" class="key-input" placeholder="PHTM-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
        <button type="button" class="btn-paste" onclick="pasteFromClipboard()">วาง</button>
      </div>
    </div>

    <button id="loginBtn" class="btn-unlock" onclick="performLogin()">
      <span id="loginBtnLabel">ปลดล็อก</span>
    </button>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <div class="footer-text">
    <span class="footer-link-text">ยังไม่มีคีย์? ติดต่อผู้ขายของคุณ</span>
    <span class="footer-sub-text">เวลาของคุณจะเริ่มนับเมื่อเชื่อมต่อ</span>
  </div>
</div>

<div></div>

<script>
// ถอดรหัสเวลาอายุคีย์เดิม (2ชม, 3ชม, 6ชม, 12ชม, 24ชม, 3วัน, 7วัน, 14วัน, 30วัน)
function detectKeyDurationMs(keyStr, apiResp) {
  if (apiResp) {
    if (typeof apiResp.expires_in === 'number' && apiResp.expires_in > 0) return apiResp.expires_in * 1000;
    if (typeof apiResp.duration_hours === 'number' && apiResp.duration_hours > 0) return apiResp.duration_hours * 3600 * 1000;
    if (typeof apiResp.duration_days === 'number' && apiResp.duration_days > 0) return apiResp.duration_days * 86400 * 1000;
    if (apiResp.expire_timestamp) {
      const t = parseInt(apiResp.expire_timestamp, 10);
      if (!isNaN(t) && t > Date.now()) return t - Date.now();
    }
  }

  const k = (keyStr || '').toUpperCase();
  if (/(?:^|[^0-9])2\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 2 * 3600 * 1000;
  if (/(?:^|[^0-9])3\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 3 * 3600 * 1000;
  if (/(?:^|[^0-9])6\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 6 * 3600 * 1000;
  if (/(?:^|[^0-9])12\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 12 * 3600 * 1000;
  if (/(?:^|[^0-9])(?:24\s*(?:H|HR|HOUR|ชม|ชั่วโมง)|1\s*(?:D|DAY|วัน))(?:[^0-9]|$)/i.test(k)) return 24 * 3600 * 1000;
  if (/(?:^|[^0-9])3\s*(?:D|DAY|วัน)(?:[^0-9]|$)/i.test(k)) return 3 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:7\s*(?:D|DAY|วัน)|1\s*(?:W|WEEK|สัปดาห์|อาทิตย์))(?:[^0-9]|$)/i.test(k)) return 7 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:14\s*(?:D|DAY|วัน)|2\s*(?:W|WEEK|สัปดาห์|อาทิตย์))(?:[^0-9]|$)/i.test(k)) return 14 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:30\s*(?:D|DAY|วัน)|1\s*(?:M|MONTH|เดือน))(?:[^0-9]|$)/i.test(k)) return 30 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:60\s*(?:D|DAY|วัน)|2\s*(?:M|MONTH|เดือน))(?:[^0-9]|$)/i.test(k)) return 60 * 86400 * 1000;

  return 24 * 3600 * 1000;
}

async function pasteFromClipboard() {
  const input = document.getElementById('keyInput');
  if (navigator.clipboard && navigator.clipboard.readText) {
    try {
      const text = await navigator.clipboard.readText();
      if (text && text.trim() !== '') {
        input.value = text.trim();
        showStatus('วางคีย์สำเร็จแล้ว', true);
        setTimeout(() => { document.getElementById('statusBox').style.display = 'none'; }, 1200);
        return;
      }
    } catch (e) {}
  }
  const fallback = prompt('กรุณาวางรหัสคีย์ของคุณ:');
  if (fallback) input.value = fallback.trim();
}

function getDeviceSerial() {
  let s = localStorage.getItem('sd_device_serial_lite');
  if (!s) {
    try {
      const raw = `${window.screen.width}x${window.screen.height}-${navigator.userAgent}`;
      let h = 0;
      for (let i = 0; i < raw.length; i++) {
        h = ((h << 5) - h) + raw.charCodeAt(i);
        h = h & h;
      }
      s = 'SD-' + Math.abs(h).toString(16).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    } catch(e) {
      s = 'SD-' + Math.random().toString(16).substring(2, 10).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    }
  }
  return s;
}

function showStatus(text, isSuccess = false) {
  const box = document.getElementById('statusBox');
  box.innerText = text;
  box.style.display = 'block';
  box.className = isSuccess ? 'status-msg success' : 'status-msg';
}

async function performLogin() {
  const keyInput = document.getElementById('keyInput');
  const key = keyInput.value.trim();
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');

  if (!key) {
    showStatus('กรุณากรอกรหัสคีย์ก่อนเข้าสู่ระบบ');
    keyInput.focus();
    return;
  }

  btnLabel.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
  btn.disabled = true;

  const serial = getDeviceSerial();
  const bodyData = new URLSearchParams({ game: 'SUNNYWIRE', user_key: key, serial: serial }).toString();

  try {
    const response = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: bodyData
    });
    const r = await response.json();
    btnLabel.innerText = 'ปลดล็อก';
    btn.disabled = false;

    if (r.status === true) {
      showStatus('เข้าสู่ระบบสำเร็จ! กำลังไปที่เมนู...', true);

      const durationMs = detectKeyDurationMs(key, r);
      const now = Date.now();
      const expiryTimestamp = now + durationMs;
      localStorage.setItem('sd_saved_user_key', key);
      localStorage.setItem('sunny_key_activated_at', now);
      localStorage.setItem('sunny_key_expiry', expiryTimestamp);

      setTimeout(() => {
        if (typeof AndroidInterface !== 'undefined' && AndroidInterface.onLoginSuccess) {
          AndroidInterface.onLoginSuccess(key);
        }
        window.location.href = 'menu.html';
      }, 700);
    } else {
      showStatus(r.message || 'รหัสคีย์ไม่ถูกต้อง หรือคีย์หมดอายุแล้ว');
    }
  } catch(e) {
    btnLabel.innerText = 'ปลดล็อก';
    btn.disabled = false;
    showStatus('เกิดข้อผิดพลาด: ' + e.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('sd_saved_user_key');
  if (savedKey) document.getElementById('keyInput').value = savedKey;
});
</script>
</body>
</html>
