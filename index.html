<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY - LOGIN</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
}

input { user-select: auto; }

:root {
  --bg-deep: #050811;
  --card-bg: #0d1527;
  --card-border: #1a2846;
  --input-bg: #0b1426;
  --primary-blue: #0ea5e9;
  --accent-cyan: #38bdf8;
  --btn-bright: #e2f1ff;
  --btn-bright-hover: #ffffff;
  --txt-white: #ffffff;
  --txt-muted: #64748b;
  --txt-label: #94a3b8;
}

body.theme-oled {
  --bg-deep: #000000;
  --card-bg: #0c0c0e;
  --card-border: #222227;
  --input-bg: #111114;
  --primary-blue: #71717a;
  --accent-cyan: #ffffff;
  --btn-bright: #ffffff;
  --btn-bright-hover: #e4e4e7;
  --txt-white: #ffffff;
  --txt-muted: #52525b;
  --txt-label: #a1a1aa;
}

body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 24px 20px;
  font-family: 'Prompt', 'Inter', -apple-system, sans-serif;
  background-color: var(--bg-deep);
  color: var(--txt-white);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  overflow-x: hidden;
}

.top-bar {
  width: 100%;
  max-width: 380px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.theme-toggle-btn {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--accent-cyan);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
}

.lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--txt-label);
  font-size: 13px;
  font-weight: 500;
  background: var(--card-bg);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--card-border);
}

.login-wrapper {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 28px;
}

.logo-hud-frame {
  width: 90px;
  height: 90px;
  border-radius: 24px;
  padding: 4px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.4) 0%, rgba(14, 165, 233, 0.1) 100%);
  border: 1px solid var(--card-border);
  box-shadow: 0 0 25px rgba(14, 165, 233, 0.25);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
}

.brand-title {
  font-family: 'Inter', sans-serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 4px;
  color: #ffffff;
  margin-bottom: 8px;
}

.brand-desc {
  font-size: 13px;
  color: var(--txt-muted);
  font-weight: 400;
}

.form-box {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--txt-label);
}

.field-label-square {
  width: 7px;
  height: 7px;
  background: var(--accent-cyan);
}

.input-chamfer-border {
  position: relative;
  width: 100%;
  height: 52px;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  display: flex;
  align-items: center;
  padding: 0 10px 0 16px;
}

.input-chamfer-border:focus-within {
  border-color: var(--accent-cyan);
}

.key-input {
  flex: 1;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--txt-white);
  font-size: 14.5px;
  font-family: 'Inter', monospace;
  font-weight: 600;
}

.btn-paste {
  height: 36px;
  padding: 0 14px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: #94a3b8;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
}

.btn-unlock {
  width: 100%;
  height: 50px;
  margin-top: 14px;
  background: var(--btn-bright);
  color: #050b16;
  border: none;
  font-family: 'Prompt', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
}

.btn-unlock:disabled { opacity: 0.6; cursor: not-allowed; }

.status-msg {
  width: 100%;
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  font-size: 13px;
  text-align: center;
  display: none;
}

.status-msg.success {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.3);
  color: #6ee7b7;
}

.footer-text {
  margin-top: 32px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.footer-link-text { font-size: 13px; color: #94a3b8; }
.footer-sub-text { font-size: 12px; color: #475569; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="theme-toggle-btn" onclick="toggleColorTheme()" title="สลับโทนสีหน้าจอ">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>
  <div class="lang-pill"><i class="fas fa-globe"></i> ไทย</div>
</div>

<div class="login-wrapper">
  <div class="brand-hero">
    <div class="logo-hud-frame">
      <img src="https://i.postimg.cc/SNrTx4V6/Picsart-26-09-05-09-29-37-550.png" alt="SUNNY Logo" class="brand-logo-img">
    </div>
    <h1 class="brand-title">SUNNY</h1>
    <p class="brand-desc">ไม่ต้องมีบัญชี ไม่ต้องมีรหัสผ่าน ใช้แค่คีย์</p>
  </div>

  <div class="form-box">
    <div class="field-label-row">
      <div class="field-label-square"></div>
      <span>คีย์เข้าใช้งาน</span>
    </div>

    <div class="input-chamfer-border">
      <input type="text" id="keyInput" class="key-input" placeholder="SUNNY-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
      <button type="button" class="btn-paste" onclick="pasteFromClipboard()">วาง</button>
    </div>

    <button id="loginBtn" class="btn-unlock" onclick="performLogin()">
      <span id="loginBtnLabel">ปลดล็อก</span>
    </button>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <div class="footer-text">
    <span class="footer-link-text">ยังไม่มีคีย์? ติดต่อผู้ขายของคุณ</span>
    <span class="footer-sub-text">รองรับคีย์ 2ชม. 3ชม. 6ชม. 12ชม. 24ชม. 3วัน 7วัน 14วัน 30วัน</span>
  </div>
</div>

<div></div>

<script>
// สลับสีอัตโนมัติ: 19:00 - 07:00 มืด
function initColorTheme() {
  const manual = localStorage.getItem('sunny_theme_preference');
  if (manual === 'dark' || manual === 'blue') {
    applyTheme(manual === 'dark');
    return;
  }
  const hour = new Date().getHours();
  const isNight = (hour >= 19 || hour < 7);
  applyTheme(isNight);
}

function toggleColorTheme() {
  const isCurrentlyDark = document.body.classList.contains('theme-oled');
  const newDark = !isCurrentlyDark;
  localStorage.setItem('sunny_theme_preference', newDark ? 'dark' : 'blue');
  applyTheme(newDark);
}

function applyTheme(isDark) {
  const icon = document.getElementById('themeIcon');
  if (isDark) {
    document.body.classList.add('theme-oled');
    if (icon) icon.className = 'fas fa-sun';
  } else {
    document.body.classList.remove('theme-oled');
    if (icon) icon.className = 'fas fa-moon';
  }
}

// ถอดรหัสเวลาอายุคีย์ (2ชม, 3ชม, 6ชม, 12ชม, 24ชม, 3วัน, 7วัน, 14วัน, 30วัน)
function detectKeyDurationMs(keyStr, apiResp) {
  if (apiResp) {
    if (typeof apiResp.expires_in === 'number' && apiResp.expires_in > 0) return apiResp.expires_in * 1000;
    if (typeof apiResp.duration_hours === 'number' && apiResp.duration_hours > 0) return apiResp.duration_hours * 3600 * 1000;
    if (typeof apiResp.duration_days === 'number' && apiResp.duration_days > 0) return apiResp.duration_days * 86400 * 1000;
    if (apiResp.expire_timestamp) {
      const t = parseInt(apiResp.expire_timestamp, 10);
      if (!isNaN(t) && t > Date.now()) return t - Date.now();
    }
  }

  const k = (keyStr || '').toUpperCase();
  if (/(?:^|[^0-9])2\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 2 * 3600 * 1000;
  if (/(?:^|[^0-9])3\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 3 * 3600 * 1000;
  if (/(?:^|[^0-9])6\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 6 * 3600 * 1000;
  if (/(?:^|[^0-9])12\s*(?:H|HR|HOUR|ชม|ชั่วโมง)(?:[^0-9]|$)/i.test(k)) return 12 * 3600 * 1000;
  if (/(?:^|[^0-9])(?:24\s*(?:H|HR|HOUR|ชม|ชั่วโมง)|1\s*(?:D|DAY|วัน))(?:[^0-9]|$)/i.test(k)) return 24 * 3600 * 1000;
  if (/(?:^|[^0-9])3\s*(?:D|DAY|วัน)(?:[^0-9]|$)/i.test(k)) return 3 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:7\s*(?:D|DAY|วัน)|1\s*(?:W|WEEK|สัปดาห์|อาทิตย์))(?:[^0-9]|$)/i.test(k)) return 7 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:14\s*(?:D|DAY|วัน)|2\s*(?:W|WEEK|สัปดาห์|อาทิตย์))(?:[^0-9]|$)/i.test(k)) return 14 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:30\s*(?:D|DAY|วัน)|1\s*(?:M|MONTH|เดือน))(?:[^0-9]|$)/i.test(k)) return 30 * 86400 * 1000;
  if (/(?:^|[^0-9])(?:60\s*(?:D|DAY|วัน)|2\s*(?:M|MONTH|เดือน))(?:[^0-9]|$)/i.test(k)) return 60 * 86400 * 1000;

  return 24 * 3600 * 1000;
}

async function pasteFromClipboard() {
  const input = document.getElementById('keyInput');
  if (navigator.clipboard && navigator.clipboard.readText) {
    try {
      const text = await navigator.clipboard.readText();
      if (text && text.trim() !== '') {
        input.value = text.trim();
        showStatus('วางคีย์สำเร็จแล้ว', true);
        setTimeout(() => { document.getElementById('statusBox').style.display = 'none'; }, 1200);
        return;
      }
    } catch (e) {}
  }
  const fallback = prompt('กรุณาวางรหัสคีย์ของคุณ:');
  if (fallback) input.value = fallback.trim();
}

function getDeviceSerial() {
  let s = localStorage.getItem('sd_device_serial_lite');
  if (!s) {
    try {
      const raw = `${window.screen.width}x${window.screen.height}-${navigator.userAgent}`;
      let h = 0;
      for (let i = 0; i < raw.length; i++) {
        h = ((h << 5) - h) + raw.charCodeAt(i);
        h = h & h;
      }
      s = 'SD-' + Math.abs(h).toString(16).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    } catch(e) {
      s = 'SD-' + Math.random().toString(16).substring(2, 10).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    }
  }
  return s;
}

function showStatus(text, isSuccess = false) {
  const box = document.getElementById('statusBox');
  box.innerText = text;
  box.style.display = 'block';
  box.className = isSuccess ? 'status-msg success' : 'status-msg';
}

async function performLogin() {
  const keyInput = document.getElementById('keyInput');
  const key = keyInput.value.trim();
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');

  if (!key) {
    showStatus('กรุณากรอกรหัสคีย์ก่อนเข้าสู่ระบบ');
    keyInput.focus();
    return;
  }

  btnLabel.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
  btn.disabled = true;

  const serial = getDeviceSerial();
  const bodyData = new URLSearchParams({ game: 'SUNNYWIRE', user_key: key, serial: serial }).toString();

  try {
    const response = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: bodyData
    });
    const r = await response.json();
    btnLabel.innerText = 'ปลดล็อก';
    btn.disabled = false;

    if (r.status === true) {
      showStatus('เข้าสู่ระบบสำเร็จ! กำลังไปที่เมนู...', true);

      const durationMs = detectKeyDurationMs(key, r);
      const expiryTimestamp = Date.now() + durationMs;
      localStorage.setItem('sd_saved_user_key', key);
      localStorage.setItem('sunny_key_expiry', expiryTimestamp);

      setTimeout(() => {
        if (typeof AndroidInterface !== 'undefined' && AndroidInterface.onLoginSuccess) {
          AndroidInterface.onLoginSuccess(key);
        }
        window.location.href = 'menu.html';
      }, 700);
    } else {
      showStatus(r.message || 'รหัสคีย์ไม่ถูกต้อง หรือคีย์หมดอายุแล้ว');
    }
  } catch(e) {
    btnLabel.innerText = 'ปลดล็อก';
    btn.disabled = false;
    showStatus('เกิดข้อผิดพลาด: ' + e.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initColorTheme();
  const savedKey = localStorage.getItem('sd_saved_user_key');
  if (savedKey) document.getElementById('keyInput').value = savedKey;
});
</script>
</body>
</html>
