<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY PROXY - LOGIN</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
input {
  user-select: auto;
}

:root {
  --f-main: 'Kanit', sans-serif;
  --f-num: 'Chakra Petch', sans-serif;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --input-bg: #f1f5f9;
  --input-border: #cbd5e1;
  --input-txt: #0f172a;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-glow: rgba(37, 99, 235, 0.2);
  --txt-main: #0f172a;
  --txt-muted: #64748b;
  --success: #10b981;
  --error: #ef4444;
}

html, body {
  min-height: 100vh;
  font-family: var(--f-main);
  background: var(--bg);
  color: var(--txt-main);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Subtle Background Effect */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.08), transparent 70%);
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 350px;
  margin: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 30px 24px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
  box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
}

/* Logo Ring */
.logo-ring {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  background: rgba(37, 99, 235, 0.1);
  color: var(--primary);
  font-size: 30px;
}

.brand-name {
  font-family: var(--f-num);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--primary);
  line-height: 1.1;
}

.sub-title {
  font-size: 12px;
  color: var(--txt-muted);
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 1px;
}

.divider {
  width: 36px;
  height: 3px;
  background: var(--primary);
  border-radius: 2px;
  margin: 16px 0 18px;
  opacity: 0.85;
}

/* Form Container */
.form-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input-row {
  display: flex;
  align-items: center;
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  padding: 4px 4px 4px 14px;
  height: 48px;
  transition: all 0.2s ease;
}

.input-row:focus-within {
  border-color: var(--primary);
  background: #ffffff;
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.key-input {
  flex: 1;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--input-txt);
  font-size: 14px;
  font-family: var(--f-main);
  font-weight: 400;
  min-width: 0;
}

.key-input::placeholder {
  color: #94a3b8;
}

.btn-paste {
  flex-shrink: 0;
  height: 36px;
  padding: 0 14px;
  background: #ffffff;
  color: var(--primary);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  font-family: var(--f-main);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-paste:hover {
  border-color: var(--primary);
  background: rgba(37, 99, 235, 0.05);
}

.btn-paste:active {
  transform: scale(0.96);
}

/* Action Buttons */
.btn-activate {
  width: 100%;
  height: 48px;
  background: var(--primary);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  font-family: var(--f-main);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--primary-glow);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-activate:hover {
  background: var(--primary-hover);
}

.btn-activate:active {
  transform: scale(0.98);
}

.btn-activate:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-youtube {
  width: 100%;
  height: 44px;
  background: transparent;
  color: var(--txt-muted);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  font-family: var(--f-main);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.btn-youtube:hover {
  color: var(--primary);
  border-color: var(--primary);
  background: rgba(37, 99, 235, 0.03);
}

.btn-youtube:active {
  transform: scale(0.98);
}

/* Status Alert Box */
.status-msg {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--error);
  font-size: 12px;
  text-align: center;
  font-weight: 500;
  display: none;
  line-height: 1.4;
}

.status-msg.success {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: var(--success);
}

/* Footer Details */
.footer-info {
  margin-top: 18px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: var(--txt-muted);
  font-family: var(--f-num);
}
</style>
</head>
<body>

<div class="card">

  <!-- Brand Header -->
  <div class="logo-ring">
    <i class="fas fa-sun"></i>
  </div>

  <div class="brand-name">SUNNY PROXY</div>
  <div class="sub-title">AUTHENTICATION</div>
  <div class="divider"></div>

  <!-- Form -->
  <div class="form-container">
    <div class="input-row">
      <input type="text" id="keyInput" class="key-input" placeholder="Enter Activation Key" autocomplete="off">
      <button type="button" class="btn-paste" id="pasteBtn" onclick="pasteKey()">PASTE</button>
    </div>

    <button id="loginBtn" class="btn-activate" onclick="performLogin()">
      <span id="loginBtnLabel">LOGIN</span>
    </button>

    <a href="https://xasui.ws.xdnz.in.th" target="_blank" class="btn-youtube">
      <i class="fab fa-youtube"></i> YOUTUBE
    </a>

    <!-- Status Alert -->
    <div id="statusBox" class="status-msg"></div>
  </div>

  <!-- Footer -->
  <div class="footer-info" id="deviceDisplay">HWID: กำลังโหลด...</div>

</div>

<script>
// Paste from clipboard into the key input
async function pasteKey() {
  const input = document.getElementById('keyInput');
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      input.value = text.trim();
      input.focus();
    }
  } catch (e) {
    input.focus();
  }
}

// Generate Device Serial / HWID
function getDeviceSerial() {
  let s = localStorage.getItem('sd_device_serial_lite');
  if (!s) {
    try {
      const raw = `${window.screen.width}x${window.screen.height}-${navigator.userAgent}`;
      let h = 0;
      for (let i = 0; i < raw.length; i++) {
        h = ((h << 5) - h) + raw.charCodeAt(i);
        h = h & h;
      }
      s = 'SD-' + Math.abs(h).toString(16).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    } catch(e) {
      s = 'SD-' + Math.random().toString(16).substring(2, 10).toUpperCase();
      localStorage.setItem('sd_device_serial_lite', s);
    }
  }
  return s;
}

// Show Status Notification Box
function showStatus(text, isSuccess = false) {
  const box = document.getElementById('statusBox');
  box.innerText = text;
  box.style.display = 'block';
  box.className = isSuccess ? 'status-msg success' : 'status-msg';
}

// Perform Login Function
async function performLogin() {
  const keyInput = document.getElementById('keyInput');
  const key = keyInput.value.trim();
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');

  if (!key) {
    showStatus('กรุณากรอกรหัสคีย์ก่อนเข้าสู่ระบบครับ!');
    keyInput.focus();
    return;
  }

  btnLabel.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  btn.disabled = true;
  document.getElementById('statusBox').style.display = 'none';

  const serial = getDeviceSerial();
  const url = 'https://qqshop.xyz/connect';
  const bodyData = 'game=SDSHOP&user_key=' + encodeURIComponent(key) + '&serial=' + encodeURIComponent(serial);

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: bodyData
    });

    const r = await response.json();
    btnLabel.innerText = 'ACTIVATE';
    btn.disabled = false;

    if (r.status === true) {
      showStatus('เข้าสู่ระบบสำเร็จ! กำลังเข้าสู่แอปพลิเคชัน...', true);
      localStorage.setItem('sd_saved_user_key', key);

      setTimeout(() => {
        if (typeof AndroidInterface !== 'undefined' && AndroidInterface.onLoginSuccess) {
          AndroidInterface.onLoginSuccess(key);
        }
      }, 500);
    } else {
      showStatus('รหัสคีย์ไม่ถูกต้อง หรือคีย์หมดอายุแล้ว!');
      localStorage.removeItem('sd_saved_user_key');
    }
  } catch(e) {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        btnLabel.innerText = 'ACTIVATE';
        btn.disabled = false;
        if (xhr.status === 200) {
          try {
            const r = JSON.parse(xhr.responseText);
            if (r.status === true) {
              showStatus('เข้าสู่ระบบสำเร็จ! กำลังเข้าสู่แอปพลิเคชัน...', true);
              localStorage.setItem('sd_saved_user_key', key);
              setTimeout(() => {
                if (typeof AndroidInterface !== 'undefined' && AndroidInterface.onLoginSuccess) {
                  AndroidInterface.onLoginSuccess(key);
                }
              }, 500);
            } else {
              showStatus('รหัสคีย์ไม่ถูกต้อง หรือคีย์หมดอายุแล้ว!');
            }
          } catch(errEx) {
            showStatus('เกิดข้อผิดพลาดในการประมวลผลจากเซิร์ฟเวอร์');
          }
        } else {
          showStatus('เกิดข้อผิดพลาด: ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
        }
      }
    };
    xhr.send(bodyData);
  }
}

// Initialize on Document Load
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('deviceDisplay').innerText = 'HWID: ' + getDeviceSerial();
  const savedKey = localStorage.getItem('sd_saved_user_key');
  if (savedKey) {
    document.getElementById('keyInput').value = savedKey;
  }
});
</script>
</body>
</html>
