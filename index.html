<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY WIRE - SYSTEM MAINTENANCE</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts: Inter & Prompt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

:root {
  --bg-color: #0b0b0e;
  --card-bg: #141418;
  --border-color: rgba(255, 255, 255, 0.06);
  
  --primary-purple: #6d4aff;
  --primary-glow: rgba(109, 74, 255, 0.35);
  
  --txt-white: #ffffff;
  --txt-muted: #737380;
  --txt-label: #8f8fa0;
  --color-amber: #f59e0b;
  --color-red: #ef4444;
}

body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-color);
  color: var(--txt-white);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Card Container */
.maintenance-card {
  width: 100%;
  max-width: 385px;
  background-color: var(--card-bg);
  border-radius: 26px;
  padding: 40px 26px 36px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: fadeIn 0.4s ease-out;
  position: relative;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Logo */
.logo-box {
  width: 66px;
  height: 66px;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1a20;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Title & Subtitle */
.card-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--txt-white);
  margin-bottom: 6px;
}

.maintenance-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.35);
  color: #fbbf24;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
}

.badge-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f59e0b;
  box-shadow: 0 0 8px #f59e0b;
  animation: pulseDot 1.5s infinite;
}

@keyframes pulseDot {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

/* Maintenance Content Box */
.update-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  width: 100%;
}

.update-icon-wrap {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: rgba(109, 74, 255, 0.1);
  border: 1px solid rgba(109, 74, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.update-icon {
  font-size: 32px;
  color: #a78bfa;
  animation: spinSlow 6s linear infinite;
}

@keyframes spinSlow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.update-title {
  font-size: 19px;
  font-weight: 800;
  color: #ffffff;
}

.update-desc {
  font-size: 13.5px;
  color: var(--txt-muted);
  line-height: 1.6;
}

.notice-warning-box {
  width: 100%;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 12px;
  padding: 11px 14px;
  color: #fca5a5;
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* Button Group */
.action-buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.btn-discord {
  width: 100%;
  height: 48px;
  background: #5865F2;
  color: #ffffff;
  border-radius: 14px;
  font-size: 14.5px;
  font-weight: 700;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 18px rgba(88, 101, 242, 0.35);
}

.btn-discord:hover {
  background: #4752c4;
}

.btn-exit {
  width: 100%;
  height: 46px;
  background: #1c1c24;
  border: 1px solid #2b2b36;
  border-radius: 14px;
  color: #a1a1aa;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn-exit:hover {
  background: #252530;
  color: #ffffff;
  border-color: #3f3f4e;
}
</style>
</head>
<body>

<div class="maintenance-card">

  <!-- Logo -->
  <div class="logo-box">
    <img src="https://i.postimg.cc/SNrTx4V6/Picsart-26-09-05-09-29-37-550.png" alt="SUNNY WIRE Logo" class="logo-img">
  </div>

  <!-- Header Titles -->
  <h1 class="card-title">SUNNY WIRE</h1>
  <div class="maintenance-badge">
    <span class="badge-dot"></span> MAINTENANCE MODE
  </div>

  <!-- Locked Screen Content -->
  <div class="update-box">
    <div class="update-icon-wrap">
      <i class="fas fa-tools update-icon"></i>
    </div>

    <div class="update-title">ระบบกำลังอัปเดต</div>
    
    <div class="update-desc">
      ขณะนี้ระบบกำลังปิดปรับปรุงชั่วคราว<br>
      เพื่ออัปเดตระบบความปลอดภัยและฟังก์ชันใหม่<br>
      สามารถติดตามประกาศเปิดระบบได้ที่ Discord ครับ
    </div>

    <div class="notice-warning-box">
      <i class="fas fa-lock"></i> ระบบล็อกการเข้าสู่ระบบทั้งหมดชั่วคราว
    </div>

    <!-- ปุ่มออกจากเว็บ & ปุ่ม Discord -->
    <div class="action-buttons">
      <a href="https://discord.gg/jT4QhEeXx" target="_blank" class="btn-discord">
        <i class="fab fa-discord"></i> Discord Server
      </a>
      <button type="button" class="btn-exit" onclick="exitWebsite()">
        <i class="fas fa-sign-out-alt"></i> ออกจากเว็บไซต์
      </button>
    </div>
  </div>

</div>

<script>
// ฟังก์ชันกดออกจากเว็บไซต์
function exitWebsite() {
  // พยายามปิดแท็บเบราว์เซอร์
  window.close();

  // แผนสำรองกรณีเบราว์เซอร์บล็อกคำสั่ง window.close()
  setTimeout(() => {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = 'about:blank';
    }
  }, 250);
}

// ล็อคการคลิกขวาและการตรวจสอบหน้าเว็บ
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  // บล็อก F12, Ctrl+Shift+I, Ctrl+U
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
